name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Termux scripts
        run: shellcheck scripts/*.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci

      - name: Verify and package
        id: package
        env:
          ATLANTA_INSTALL_BROWSER: "1"
          ATLANTA_BROWSER_CONCURRENCY: "2"
        run: npm run package

      - name: Generate formatting patch
        if: ${{ failure() && steps.package.outcome == 'failure' && hashFiles('reports/verification.json') != '' }}
        run: |
          if node -e 'process.exit(require("./reports/verification.json").checks.some(check => check.name === "format" && !check.passed) ? 0 : 1)'; then
            npm run format
            git diff --binary -- > reports/prettier.patch
          fi

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-release
          path: |
            dist/ATLANTA-Contour-Offline-*.html
            dist/manifest.json
            releases/ATLANTA-CAM-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-debug
          path: |
            dist/index.html
            dist/app.js
            dist/app.js.map
            dist/style.css
            dist/worker.js
          if-no-files-found: error
          retention-days: 30

      - name: Measure browser test concurrency
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { availableParallelism } from "node:os";
          import { testArguments } from "./scripts/test.mjs";

          console.log("BROWSER_BENCH_RUNNER " + availableParallelism());
          for (const [index, workers] of [1, 2, 2, 1, 1, 2].entries()) {
            process.env.ATLANTA_BROWSER_CONCURRENCY = String(workers);
            const args = await testArguments("browser");
            const start = performance.now();
            const result = spawnSync(process.execPath, ["--test-reporter=tap", ...args], {
              encoding: "utf8",
              timeout: 120000,
              maxBuffer: 16 * 1024 * 1024,
            });
            const durationMs = Math.round(performance.now() - start);
            const totals = Object.fromEntries(
              [...result.stdout.matchAll(/^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$/gm)]
                .map(([, name, value]) => [name, Number(value)]),
            );
            console.log("BROWSER_BENCH " + JSON.stringify({
              run: index + 1, pair: Math.floor(index / 2) + 1, workers, durationMs, ...totals,
            }));
            if (result.status !== 0) {
              process.stderr.write(result.stdout + result.stderr);
              throw result.error || new Error("Browser tests failed");
            }
            assert.deepEqual(totals, {
              tests: 41, pass: 41, fail: 0, cancelled: 0, skipped: 0, todo: 0,
            });
          }
          JS
