name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Termux scripts
        run: shellcheck scripts/*.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci

      - name: Verify and package
        id: package
        env:
          ATLANTA_INSTALL_BROWSER: "1"
          ATLANTA_BROWSER_CONCURRENCY: "2"
        run: npm run package

      - name: Generate formatting patch
        if: ${{ failure() && steps.package.outcome == 'failure' && hashFiles('reports/verification.json') != '' }}
        run: |
          if node -e 'process.exit(require("./reports/verification.json").checks.some(check => check.name === "format" && !check.passed) ? 0 : 1)'; then
            npm run format
            git diff --binary -- > reports/prettier.patch
          fi

      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-release
          path: |
            dist/ATLANTA-Contour-Offline-*.html
            dist/manifest.json
            releases/ATLANTA-CAM-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-debug
          path: |
            dist/index.html
            dist/app.js
            dist/app.js.map
            dist/style.css
            dist/worker.js
          if-no-files-found: error
          retention-days: 30

  kotlin-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test Kotlin core
        working-directory: android
        run: ./gradlew --no-daemon build

  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK and instrumented tests
        working-directory: android
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew -p app --no-daemon :assembleDebug :assembleDebugAndroidTest

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and test APK on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: android/gradlew -p android/app --no-daemon :connectedDebugAndroidTest

      - name: Upload Android test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-android-tests
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tested debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlanta-cam-android-debug
          path: android/app/build/outputs/apk/debug/atlanta-cam-android-debug.apk
          if-no-files-found: error
          retention-days: 30
