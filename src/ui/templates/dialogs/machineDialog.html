<dialog id="machineDialog" aria-labelledby="machineDialogTitle">
  <div class="modalHeader">
    <h2 id="machineDialogTitle">Профиль станка</h2>
    <button id="closeMachine" class="square" aria-label="Закрыть выбор станка" hidden title="×">
      ×
    </button>
  </div>
  <div class="machineChoice">
    <button id="selectFanuc" class="machineOption" title="FANUC 3000C">
      <b>FANUC 3000C</b><span>Координаты ×1000 · подача ×10</span>
    </button>
  </div>
</dialog>
