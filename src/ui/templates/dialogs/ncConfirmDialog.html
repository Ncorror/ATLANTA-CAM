<dialog id="ncConfirmDialog" class="confirmDialog" aria-labelledby="ncConfirmHeading">
  <div class="modalHeader">
    <h2 id="ncConfirmHeading">Редактор готовой программы</h2>
    <button id="closeNcConfirm" class="square" type="button" aria-label="Закрыть" title="×">
      ×
    </button>
  </div>
  <div class="confirmBody">
    <p id="ncConfirmWarning">Текущий прогресс чертежа, обработки при согласии будет удален.</p>
    <div class="row confirmActions">
      <button id="cancelNcConfirm" class="outline" type="button">Отмена</button
      ><button id="acceptNcConfirm" class="primary" type="button">Продолжить</button>
    </div>
  </div>
</dialog>
